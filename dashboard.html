<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simbabot — Dashboard</title><style>:root{--bg:#050806;--panel:#0b120e;--line:#17341f;--green:#39ff88;--muted:#9bb2a2;--text:#f3fff6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}.wrap{max-width:1100px;margin:auto;padding:22px}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900}.logo span{color:var(--green)}.btn{padding:10px 15px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none}.hero{padding:40px 0 25px}.hero p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.label{color:var(--muted);font-size:13px}.value{font-size:28px;font-weight:800;margin-top:7px}.green{color:var(--green)}.wide{margin-top:15px}.bar{height:12px;background:#142219;border-radius:20px;overflow:hidden}.fill{height:100%;width:62%;background:var(--green)}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><div class="logo">SIMBA<span>BOT</span></div><a class="btn" href="index.html">Log out</a></nav><div class="hero"><h1>Dashboard</h1><p>Demo environment — live trading is disabled.</p></div><div class="grid"><div class="card"><div class="label">Demo balance</div><div class="value">$10,000</div></div><div class="card"><div class="label">Equity</div><div class="value">$10,240</div></div><div class="card"><div class="label">Bot status</div><div class="value green">READY</div></div><div class="card"><div class="label">MT5 status</div><div class="value">DEMO</div></div></div><div class="card wide"><h2>Risk setting</h2><p class="label">Illustrative demo setting</p><div class="bar"><div class="fill"></div></div><p class="label">Risk profile: Controlled · 62%</p></div></div></body></html>

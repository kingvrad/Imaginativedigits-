<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simbabot — Create account</title>
<style>
:root{--bg:#050806;--panel:#0b120e;--line:#17341f;--green:#39ff88;--muted:#9bb2a2;--text:#f3fff6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px}
.logo{font-size:24px;font-weight:900}.logo span{color:var(--green)}p{color:var(--muted)}
label{display:block;margin:16px 0 7px}input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#07100a;color:white;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:var(--green);font-weight:800;font-size:16px}
.small{text-align:center;font-size:14px;margin-top:18px}a{color:var(--green)}
</style></head>
<body><div class="box"><div class="logo">SIMBA<span>BOT</span></div><h1>Create account</h1><p>Create your Simbabot account. This prototype does not send or store account details.</p>
<form onsubmit="event.preventDefault();location.href='dashboard.html'">
<label>Name</label><input required placeholder="Your name">
<label>Email</label><input type="email" required placeholder="you@example.com">
<label>Choose a password</label><input type="password" minlength="8" required placeholder="At least 8 characters">
<button>Create account</button></form>
<p class="small">Already registered? <a href="login.html">Log in</a></p></div></body></html>
